<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Bipolar Bros</title>
    <style>
        :root { --primary-blue: #003366; --light-blue: #00aaff; --white: #ffffff; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg); color: #333; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        
        /* Navigation */
        nav { background: var(--primary-blue); padding: 1rem 0; text-align: center; position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; font-size: 1.1rem; }
        
        /* Gallery Sections */
        .gallery-section { margin-bottom: 100px; scroll-margin-top: 80px; } 
        h2 { color: var(--primary-blue); font-size: 2.5rem; border-bottom: 3px solid var(--light-blue); padding-bottom: 10px; margin-bottom: 30px; }
        
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            gap: 25px; 
        }
        
        .gallery-grid img { 
            width: 100%; 
            height: 450px; 
            object-fit: cover; 
            border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .gallery-grid img:hover { transform: scale(1.02); }

        footer { text-align: center; padding: 60px 40px; color: #777; font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="gallery.html">Gallery</a>
        <a href="aboutthebros.html">About</a>
        <a href="theinitiative.html">Initiative</a>
    </nav>

    <div class="container">
        
        <section id="whitehouse" class="gallery-section">
            <h2>Steve's Whitehouse Trip</h2>
            <div class="gallery-grid">
                <img src="images/whitehouse/whitehouse1.jpeg" alt="Whitehouse Event">
                <img src="images/whitehouse/whitehouse2.jpeg" alt="Whitehouse Event">
                <img src="images/whitehouse/whitehouse3.jpeg" alt="Whitehouse Event">
                <img src="images/whitehouse/steve1.jpeg" alt="Steve at the Whitehouse">
                <img src="images/whitehouse/steve2.jpeg" alt="Steve at the Whitehouse">
                <img src="images/whitehouse/steve3.jpeg" alt="Steve at the Whitehouse">
            </div>
        </section>

        <section id="toastmasters" class="gallery-section">
            <h2>Public Speaking & Leadership</h2>
            <div class="gallery-grid">
                <img src="images/toastmasters/ToastmastersGroup.jpg" alt="Bali Toastmasters Group">
                <img src="images/toastmasters/ToastmastersCandidTableTalk.png" alt="First Table Talk">
                <img src="images/toastmasters/KyleGrammarian2ndToastmasters.jpg" alt="Grammarian Speech">
                <img src="images/kyle-btc-ge.jpg" alt="Kyle General Evaluator">
                <img src="images/kyle-btc-icebreaker.jpg" alt="Kyle Icebreaker Speech">
                <img src="images/kyle-canggu-alone.jpg" alt="Kyle Canggu Toastmasters">
                <img src="images/kyle-canggu-flower.jpg" alt="Kyle Canggu Toastmasters">
                <img src="images/kyle-canggu-hani.jpg" alt="Kyle and Hani Canggu Toastmasters">
                <img src="images/kyle-mbtc-morningroutine.jpg" alt="Kyle Morning Routine Speech">
            </div>
        </section>

    </div>

    <footer>
        <p>&copy; 2026 Bipolar Bros. All rights reserved.</p>
    </footer>

</body>
</html>
