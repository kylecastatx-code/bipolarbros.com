<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Bipolar Bros</title>
    <style>
        :root { --primary-blue: #003366; --white: #ffffff; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: #333; }
        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        
        nav { background: var(--primary-blue); padding: 1rem 0; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }

        .gallery-section { margin-bottom: 80px; scroll-margin-top: 50px; }
        h2 { color: var(--primary-blue); border-bottom: 3px solid var(--primary-blue); padding-bottom: 10px; }
        
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 20px; 
            margin-top: 30px; 
        }
        .gallery-grid img { 
            width: 100%; 
            height: 400px; 
            object-fit: cover; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        footer { text-align: center; padding: 40px; color: #777; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="gallery.html">Gallery</a>
    </nav>

    <div class="container">
        
        <div id="whitehouse" class="gallery-section">
            <h2>Steve's Whitehouse Trip</h2>
            <div class="gallery-grid">
                <img src="images/whitehouse/whitehouse1.jpeg">
                <img src="images/whitehouse/whitehouse2.jpeg">
                <img src="images/whitehouse/whitehouse3.jpeg">
                <img src="images/whitehouse/steve1.jpeg">
                <img src="images/whitehouse/steve2.jpeg">
                <img src="images/whitehouse/steve3.jpeg">
            </div>
        </div>

        <div id="toastmasters" class="gallery-section">
            <h2>Kyle's Toastmasters Journey</h2>
            <div class="gallery-grid">
                <img src="images/toastmasters/ToastmastersGroup.jpg">
                <img src="images/toastmasters/ToastmastersIntroPic.jpg">
                <img src="images/toastmasters/ToastmastersUmalasNewMember.jpg">
            </div>
        </div>

    </div>

    <footer>&copy; 2026 Bipolar Bros. All rights reserved.</footer>
</body>
</html>
